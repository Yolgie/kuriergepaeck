name: Bug report
description: Report a problem without including real credentials or sensitive data
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, vaults, session secrets, screenshots containing private data or exploit details. Use private disclosure for security issues (SECURITY.md)."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction with synthetic test data
